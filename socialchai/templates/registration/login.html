{% extends "layout.html" %}


{% block title %}
  Login - Social Chai Application
{% endblock title %}

{% block content %}
  <div class="container mt-5" style="max-width: 500px;">
    <h2 class="text-center mb-4">Login</h2>
    
    <form method="post" class="form">
      {% csrf_token %}
      <style>
        input[type="text"],
        input[type="password"],
        input[type="email"] {
          height: 50px;
          width: 100%;
          font-size: 1.2rem;
        }
      </style>

      {{ form.as_p }}

      <button type="submit" class="btn btn-primary btn-lg w-100 mt-3">Login</button>
    </form>

    <div class="mt-3 text-center">
      <a href="{% url 'register' %}">Don't have an account? Register here</a>
    </div>
  </div>
{% endblock content %}
