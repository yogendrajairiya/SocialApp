{% extends "layout.html" %}


{% block title %}
  Registration - Social Chai Application
{% endblock title %}

{% block content %}
  <div class="container mt-5" style="max-width: 500px;">
    <h2 class="text-center mb-4">Register</h2>
    
    <form method="post" class="form">
      {% csrf_token %}
      <style>
        input[type="text"],
        input[type="password"],
        input[type="email"] {
          height: 50px;
          width: 100%;
          font-size: 1.2rem;
        }
      </style>

      {{ form.as_p }}

      <button type="submit" class="btn btn-primary btn-lg w-100 mt-3">Register</button>
    </form>

    <div class="mt-3 text-center">
      <a href="{% url 'login' %}">Already have an account? Login here</a>
    </div>
  </div>
{% endblock %}
